# Prometheus Operator scrape config for the DaemonSet and sidecars.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calibrate
  namespace: calibrate
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - { key: calibrate.io/scrape, operator: In, values: ["true"] }
  podMetricsEndpoints:
    - port: calibrate
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: calibrate-daemonset
  namespace: calibrate
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: calibrate }
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
