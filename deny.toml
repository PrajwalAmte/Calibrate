# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is an archived proc-macro pulled in by ratatui 0.29 and metal 0.29.
    # It runs only at compile time (no runtime code, no network or untrusted
    # input) and has no known vulnerability. Revisit when ratatui/metal drop it.
    { id = "RUSTSEC-2024-0436", reason = "build-time-only proc-macro; transitive via ratatui and metal" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The OpenSSL dependency was removed in favour of rustls; keep it out.
deny = [{ name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
