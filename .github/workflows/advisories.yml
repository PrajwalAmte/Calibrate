name: Security advisories

# New RustSec advisories appear independently of code changes. Checking them
# on a schedule keeps them visible without failing unrelated pull requests;
# PRs that change dependencies are still checked before merge.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml]

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories
