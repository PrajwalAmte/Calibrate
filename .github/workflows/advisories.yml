name: Security advisories

# New RustSec advisories appear independently of code changes. Checking them
# on a schedule keeps them visible without failing unrelated pull requests;
# PRs that change dependencies are still checked before merge.
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Cargo.lock, Cargo.toml, deny.toml]
  pull_request:
    paths: [Cargo.lock, Cargo.toml, deny.toml]

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
          command-arguments: advisories
