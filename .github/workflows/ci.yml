name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      # Install NVML stub headers so nvml-wrapper compiles on CI without a GPU.
      - name: Install NVML stub
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy libnvidia-ml-dev || true
          if ! pkg-config --libs nvidia-ml 2>/dev/null; then
            echo "NVML package not found; creating stub"
            sudo mkdir -p /usr/local/lib
            echo "/* stub */" | sudo tee /usr/local/lib/libnvidia-ml.so > /dev/null
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all

  diagnose-no-gpu:
    name: calibrate diagnose (Linux, no GPU)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install NVML stub (compile-time only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy libnvidia-ml-dev || true

      - name: Build release binary
        run: cargo build --release

      - name: Run calibrate diagnose (expect FAIL — no GPU in CI)
        run: |
          # Capture output; diagnose exits 1 when NVML is unavailable — that is correct.
          OUTPUT=$(./target/release/calibrate diagnose 2>/dev/null || true)
          echo "$OUTPUT"

          # Assert: Linux is listed as supported platform
          echo "$OUTPUT" | grep -q "Linux" || \
            (echo "ERROR: Expected Linux platform check in output" && exit 1)

          # Assert: nvidia-smi or NVML check appears (section was reached)
          echo "$OUTPUT" | grep -qE "nvidia-smi|NVML|nvidiactl" || \
            (echo "ERROR: Expected NVIDIA section in diagnose output" && exit 1)

          # Assert: fix instructions mention apt-get or modprobe
          echo "$OUTPUT" | grep -qE "apt-get|modprobe" || \
            (echo "ERROR: Expected remediation instructions in diagnose output" && exit 1)

          # Assert: process visibility passed (we can see our own PID)
          echo "$OUTPUT" | grep -q "Can observe own PID" || \
            (echo "ERROR: Expected own-PID visibility check to pass" && exit 1)

          # Assert: exits non-zero (FAIL is the correct outcome without a GPU)
          ./target/release/calibrate diagnose >/dev/null 2>&1 && \
            (echo "ERROR: Expected non-zero exit when GPU is unavailable" && exit 1) || true

          echo "All diagnose assertions passed."

  release-build:
    name: Release Build (Linux x86-64)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibrate-linux-x86_64
          path: target/release/calibrate

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [check, release-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: calibrate-linux-x86_64
          path: dist/

      - name: Rename binary
        run: mv dist/calibrate dist/calibrate-linux-x86_64

      - name: Build macOS binary
        uses: actions/github-script@v7
        # macOS binary is built locally — skip in CI for now; users can build from source.
        # Remove this step and add a macos runner if you want pre-built macOS binaries.
        with:
          script: core.info('macOS binary not built in CI — users build from source or install via cargo')

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "calibrate ${{ github.ref_name }}"
          body: |
            ## What's new

            See the [README](https://github.com/PrajwalAmte/Calibrate#readme) for full usage.

            ## Install

            **Linux x86-64 (pre-built binary)**
            ```bash
            curl -LsSf https://github.com/PrajwalAmte/Calibrate/releases/download/${{ github.ref_name }}/calibrate-linux-x86_64 \
              -o calibrate && chmod +x calibrate && sudo mv calibrate /usr/local/bin/
            ```

            **macOS / any platform (via Cargo)**
            ```bash
            cargo install calibrate
            ```

            **Build from source**
            ```bash
            git clone https://github.com/PrajwalAmte/Calibrate
            cd Calibrate/calibrate && cargo build --release
            ```
          files: dist/calibrate-linux-x86_64
          draft: false
          prerelease: false
