[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrate-hook"
version = "0.2.0"
description = "Training-loop instrumentation for the calibrate GPU efficiency analyzer (measured MFU and step breakdown)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Prajwal Amte" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/PrajwalAmte/Calibrate"

[tool.setuptools]
packages = ["calibrate_hook"]
